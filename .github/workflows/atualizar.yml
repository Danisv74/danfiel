name: Atualizar site

on:
  schedule:
        - cron: "11,31,51 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar o site
        run: python agregador_corinthians.py
      - name: Salvar se houve mudança
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git add -A site
            if git diff --cached --quiet; then
              echo "Sem mudanças para salvar."
              exit 0
            fi
            git commit -m "Atualiza notícias"
            if git push; then
              echo "Enviado na tentativa $tentativa."
              exit 0
            fi
            echo "Envio recusado (tentativa $tentativa). Refazendo em cima da versão mais nova."
            git fetch origin main
            git reset --hard origin/main
            python agregador_corinthians.py
          done
          echo "Não consegui enviar depois de 3 tentativas."
          exit 1
