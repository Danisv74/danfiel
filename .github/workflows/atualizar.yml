name: Atualizar site

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar o site
        run: python agregador_corinthians.py
      - name: Salvar se houve mudança
        run: |
          git config user.name "danfiel-bot"
          git config user.email "danfiel-bot@users.noreply.github.com"
          git add site/index.html
          if git diff --cached --quiet; then
            echo "Sem mudanças para salvar."
          else
            git commit -m "Atualiza notícias"
            git pull --rebase
            git push
          fi
